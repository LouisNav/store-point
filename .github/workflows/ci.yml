name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_PASSWORD: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      ROOT_ADMIN_EMAIL: ci-admin@example.com
      ROOT_ADMIN_PASSWORD: ci-password-123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src scripts --ext .ts,.tsx

      - name: Messaging smoke test
        run: npm run test:messaging

      - name: Inventory smoke test
        run: npm run test:inventory

      - name: Sync round-trip test
        run: npm run test:sync

      - name: Build (no .env needed — APP_URL/ROOT_ADMIN_* have zod defaults)
        run: npm run build
